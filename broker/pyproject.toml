[project]
name = "credbroker"
version = "0.1.8"
description = "Agent credential broker: AI agents sign in with logins the owner keeps in 1Password, approved from the owner's phone. The broker types the login itself and does not hand the password to the agent."
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
# Copies of the repository's own, kept equal by a test, so the wheel and the sdist carry them.
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "mcp>=2.3",
    "onepassword-sdk>=0.4.2,<0.5",
    "paho-mqtt>=2.2.0",
    "tldextract>=5",
    "websockets>=13",
]

[project.scripts]
credbroker-server = "credbroker.server:main"
credbroker = "credbroker.client:main"
credbroker-mcp = "credbroker.mcp_server:main"
credbroker-leakcheck = "credbroker.leakcheck:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credbroker"]
