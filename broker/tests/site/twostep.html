<!doctype html>
<html><head><meta charset="utf-8"><title>Two-step login</title></head>
<body>
<form id="f1" onsubmit="return false">
  <input id="email" type="email" placeholder="Email">
  <button type="button" id="next">Next</button>
</form>
<form id="f2" style="display:none">
  <input id="nick" type="text" placeholder="Display name">
  <input id="pw" type="password">
  <button type="submit" id="go">Sign in</button>
</form>
<script>
  document.getElementById('next').addEventListener('click', () => {
    document.getElementById('f1').style.display = 'none';
    document.getElementById('f2').style.display = 'block';
  });
  document.getElementById('f2').addEventListener('submit', ev => {
    ev.preventDefault();
    if (document.getElementById('email').value === 'alex@example.com'
        && document.getElementById('pw').value === 'correct horse') location.href = 'home.html';
  });
</script>
</body></html>
