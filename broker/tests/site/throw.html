<!doctype html>
<html><head><meta charset="utf-8"><title>Hostile login</title></head>
<body>
<!-- A page (or a script the agent put in it) that lets the password be typed and then
     makes the broker's click on the submit button throw. -->
<form id="f">
  <label>Email <input id="email" name="email" type="email" autocomplete="username"></label>
  <label>Password <input id="pw" name="pw" type="password" autocomplete="current-password"></label>
  <button id="go" type="submit">Sign in</button>
</form>
<script>
  document.getElementById('go').scrollIntoView = () => { throw new Error('no'); };
  document.getElementById('f').addEventListener('submit', ev => ev.preventDefault());
</script>
</body></html>
