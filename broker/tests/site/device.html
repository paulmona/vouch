<!doctype html>
<html><head><meta charset="utf-8"><title>Login then device check</title></head>
<body>
<form onsubmit="return false">
  <input name="username"><input name="password" type="password">
  <button type="button" id="go">Login</button>
</form>
<script>
  // Like some real portals: a click handler that only accepts trusted (real) clicks,
  // and a security-question page after the password.
  document.getElementById('go').addEventListener('click', ev => {
    if (ev.isTrusted) location.href = 'challenge.html';
  });
</script>
</body></html>
