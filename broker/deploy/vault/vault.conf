# Optional: read credbroker's secrets from HashiCorp Vault at every start
# instead of /etc/credbroker/secrets.env. install.sh installs this drop-in, for
# the broker and for the leak check, only when /etc/credbroker/vault.env exists.
# See deploy/vault/README.md.
[Service]
EnvironmentFile=/etc/credbroker/vault.env
