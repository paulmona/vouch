# Optional: load Vouch's secrets from HashiCorp Vault at every start instead of
# /etc/vouch/secrets.env. install.sh installs this drop-in only when
# /etc/vouch/vault.env exists. See deploy/vault/README.md.
[Service]
EnvironmentFile=/etc/vouch/vault.env
ExecStartPre=/usr/bin/node /opt/vouch/prod/current/src/firebase-key.ts /var/lib/vouch/.vault-creds /run/vouch/firebase.json /run/vouch/secrets.env
# Read after ExecStartPre has written it; the leading - lets a first start begin without it.
EnvironmentFile=-/run/vouch/secrets.env
