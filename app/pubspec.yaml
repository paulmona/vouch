name: vouch
description: "Vouch by Viewbridge: approve an AI agent's request for access with your fingerprint."
publish_to: "none"

# versionName+versionCode on Android. Bump both per release (tag app-vX.Y.Z).
version: 0.1.12+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  package_info_plus: ^10.2.2
  http: ^1.6.0
  crypto: ^3.0.8
  pointycastle: ^4.0.0
  vouch_api:
    path: packages/vouch_api
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.5.0
  timezone: ^0.11.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/InstrumentSerif-OFL.txt
    - assets/legal/LICENSE
    - assets/legal/NOTICE

  # Bundled, never fetched at runtime. Inter for text; Instrument Serif for
  # at most one decorative use (the splash/About tagline). Both are OFL.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
          weight: 400
